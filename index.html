    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap Demo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <main role="main">
            <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                    <img src="images/logo.png" alt="Cool Logo" style="width:50px;" class="rounded-pill"> 
                    </a>
                    <a class="navbar-brand" href="#">B.P.M</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarsExampleDefault">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarsExampleDefault">
                        <ul class="navbar-nav mr-auto">
                            <li class="nav-item"><a class="nav-link" href="#">Home </a></li>
                            <li class="nav-item"><a class="nav-link" href="#">About </a></li>
                            <li class="nav-item"><a class="nav-link" href="#">Contact </a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="container">
                <div class="p-5 mb-4 bg-light rounded-3">
                    <!-- Carousel -->
                    <div id="demo" class="carousel slide" data-bs-ride="carousel">
                        <!-- Indicators/dots -->
                        <div class="carousel-indicators">
                            <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
                            <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
                            <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
                        </div>
                        <!-- The slideshow/carousel -->
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img src="images/image3.jpg" alt="battery place market" class="d-block w-10a0">
                                <div class="carousel-caption">
                                </div>
                            </div>
                            <div class="carousel-item">
                                <img src="images/image1.jpg" alt="another image" class="d-block w-100">
                                <div class="carousel-caption">
                                </div>
                            </div>
                            <div class="carousel-item">
                                <img src="images/image2.jpg" alt="My Previous Building" class="d-block w-100">
                                <div class="carousel-caption">
                                </div>
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                        </button>
                    </div>
                </div>
            </div>
            <hr>
            <hr>
            <div class="container mt-5">
                <div class="row">
                <div class="col-md-4">
                    <div class="custom-card">Call us for more info at: <span style="color: red">(212) 786-0077</span></div>
                </div>
                <div class="col-md-4">
                    <div class="custom-card"><span style="color: green">Battery Place Market Corp.</span> is a farmer's market located in the Manhattan burrow of New YOrk. We are attached to the 70 Little West Street building in Battery Park City.</div>
                </div>
                <div class="col-md-4">
                    <div class="custom-card">See more on our location: <a href="https://www.google.com/maps/place/Battery+Place+Market+Corp/@40.7071835,-74.0196261,17z/data=!3m1!4b1!4m6!3m5!1s0x89c25a11c612caf9:0xd611a2d18b90247b!8m2!3d40.7071835!4d-74.0170512!16s%2Fg%2F1tsjfkjq?entry=ttu&g_ep=EgoyMDI2MTEwMy4wIKXMDSoASAFQAw%3D%3D">###</a></div>
                </div>
                </div>
            </div>
        </main>
    </body>
    </html>
